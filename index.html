      rel="stylesheet"
    />

    <title>Lokesh Shetty — Full-stack Developer</title>

    <!-- Set theme before paint to avoid flicker -->
    <script>
      (function () {
        try {
          var k = "ls-portfolio-theme";
          var t = localStorage.getItem(k);
          if (t !== "dark" && t !== "light") {
            t = matchMedia("(prefers-color-scheme: light)").matches
              ? "light"
              : "dark";
          }
          document.documentElement.dataset.theme = t;
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
